<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Explore Schemes</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f5f5;
  padding:20px;
  color:#222;
}

/* HEADER */

.header{
  margin-bottom:25px;
}

.header h1{
  font-size:32px;
  margin-bottom:6px;
}

.header p{
  color:#666;
}

/* SEARCH */

.search-box{
  margin-bottom:20px;
}

.search-box input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
  outline:none;
  background:white;
}

.search-box input:focus{
  border-color:#ff7a00;
}

/* CATEGORIES */

.categories{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:25px;
}

.category-btn{
  border:none;
  background:white;
  border:1px solid #ddd;
  padding:10px 18px;
  border-radius:30px;
  cursor:pointer;
  transition:0.3s;
}

.category-btn:hover{
  background:#f0f0f0;
}

.category-btn.active{
  background:#ff7a00;
  color:white;
  border-color:#ff7a00;
}

/* GRID */

.scheme-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
}

/* CARD */

.scheme-card{
  background:white;
  border-radius:16px;
  padding:20px;
  border:1px solid #e5e5e5;
  animation:fadeIn 0.4s ease;
  transition:0.3s;
}

.scheme-card:hover{
  transform:translateY(-4px);
}

.scheme-card h3{
  margin-bottom:12px;
  font-size:20px;
}

.scheme-card p{
  color:#666;
  line-height:1.5;
  margin-bottom:14px;
}

.tag{
  display:inline-block;
  background:#f3f3f3;
  padding:6px 12px;
  border-radius:20px;
  font-size:13px;
  margin-bottom:14px;
}

.apply-btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#ff7a00;
  color:white;
  cursor:pointer;
  font-size:15px;
}

.apply-btn:hover{
  background:#e46d00;
}

/* EMPTY */

.empty{
  display:none;
  text-align:center;
  margin-top:40px;
  color:#777;
}

/* ANIMATION */

@keyframes fadeIn{

  from{
    opacity:0;
    transform:translateY(10px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

</style>
</head>

<body>


<!-- HEADER -->

<div class="header">

  <h1>Explore Schemes</h1>

  <p>
    Search and explore government schemes
  </p>

</div>



<!-- SEARCH -->

<div class="search-box">

  <input
    type="text"
    id="searchInput"
    placeholder="Search schemes..."
  >

</div>



<!-- CATEGORIES -->

<div class="categories" id="categoryButtons">

</div>



<!-- SCHEMES -->

<div class="scheme-grid" id="schemeGrid">

</div>



<!-- EMPTY -->

<div class="empty" id="emptyState">

  No schemes found

</div>




<script>

/* ================= VARIABLES ================= */

let allSchemes = [];

let activeCategory = "All";



/* ================= LOAD JSON ================= */

async function loadSchemes(){

  try{

    const response =
      await fetch("explore.json");

    const data =
      await response.json();




    /* IMPORTANT */

    /*
      If your JSON structure is:

      {
        "schemes":[ ... ]
      }

      then use:
    */

    allSchemes = data.schemes || data;



    renderCategories();

    renderSchemes();

  }

  catch(error){

    console.error(error);

    alert("explore.json not found");

  }

}




/* ================= CATEGORIES ================= */

function renderCategories(){

  const container =
    document.getElementById("categoryButtons");

  container.innerHTML = "";



  const categories = [

    "All",

    ...new Set(
      allSchemes.map(
        scheme => scheme.category
      )
    )

  ];



  categories.forEach(category => {

    const button =
      document.createElement("button");



    button.className =

      activeCategory === category

      ? "category-btn active"

      : "category-btn";



    button.innerText = category;



    button.onclick = () => {

      activeCategory = category;

      renderCategories();

      renderSchemes();

    };



    container.appendChild(button);

  });

}




/* ================= SCHEMES ================= */

function renderSchemes(){

  const grid =
    document.getElementById("schemeGrid");

  const empty =
    document.getElementById("emptyState");



  const search =
    document.getElementById("searchInput")
    .value
    .toLowerCase();



  grid.innerHTML = "";



  const filteredSchemes =

    allSchemes.filter(scheme => {



      const matchCategory =

        activeCategory === "All" ||

        scheme.category === activeCategory;



      const matchSearch =

        scheme.title
        .toLowerCase()
        .includes(search)

        ||

        scheme.description
        .toLowerCase()
        .includes(search)

        ||

        scheme.category
        .toLowerCase()
        .includes(search);




      return matchCategory && matchSearch;

    });




  if(filteredSchemes.length === 0){

    empty.style.display = "block";

    return;

  }

  empty.style.display = "none";




  filteredSchemes.forEach((scheme,index) => {

    const card =
      document.createElement("div");



    card.className =
      "scheme-card";



    card.style.animationDelay =
      `${index * 0.05}s`;



    card.innerHTML = `

      <div class="tag">
        ${scheme.category}
      </div>

      <h3>
        ${scheme.title}
      </h3>

      <p>
        ${scheme.description}
      </p>

      <button class="apply-btn">
        View Scheme
      </button>

    `;



    grid.appendChild(card);

  });

}




/* ================= SEARCH ================= */

document
.getElementById("searchInput")
.addEventListener("input", renderSchemes);




/* ================= START ================= */

loadSchemes();

</script>

</body>
</html>

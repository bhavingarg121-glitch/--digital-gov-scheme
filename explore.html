<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Explore Schemes | SchemeSathi</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />

  <style>

    body{
      background:#f1f5f9;
    }

    .scheme-card{
      transition:0.3s;
    }

    .scheme-card:hover{
      transform:translateY(-5px);
    }

    .scrollbar-hide::-webkit-scrollbar{
      display:none;
    }

  </style>

</head>

<body class="min-h-screen">


<!-- =========================
HEADER
========================= -->

<header class="bg-white shadow sticky top-0 z-50">

  <div class="max-w-7xl mx-auto px-4 py-4">

    <div class="flex flex-col lg:flex-row gap-4 justify-between items-center">

      <div>
        <h1 class="text-3xl font-bold text-orange-600">
          SchemeSathi
        </h1>

        <p class="text-gray-500 text-sm">
          Explore Government Schemes Easily
        </p>
      </div>


      <!-- SEARCH -->

      <div class="relative w-full lg:w-[450px]">

        <input
          type="text"
          id="searchInput"
          placeholder="Search schemes, category, benefits..."
          class="w-full border border-gray-300 rounded-2xl py-3 pl-12 pr-4 focus:outline-none focus:ring-2 focus:ring-orange-400"
        />

        <i class="fa-solid fa-magnifying-glass absolute left-4 top-4 text-gray-400"></i>

      </div>

    </div>

  </div>

</header>



<!-- =========================
MAIN LAYOUT
========================= -->

<div class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-4 gap-6">



  <!-- =========================
  SIDEBAR
  ========================= -->

  <aside class="bg-white rounded-3xl shadow p-5 h-fit sticky top-24">

    <div class="flex items-center justify-between mb-5">

      <h2 class="text-xl font-bold">
        Categories
      </h2>

      <span
        id="schemeCount"
        class="bg-orange-100 text-orange-600 px-3 py-1 rounded-full text-sm font-bold"
      >
        0
      </span>

    </div>


    <!-- CATEGORY LIST -->

    <div
      id="categoryContainer"
      class="space-y-3 max-h-[700px] overflow-y-auto scrollbar-hide"
    >
    </div>

  </aside>





  <!-- =========================
  SCHEMES SECTION
  ========================= -->

  <section class="lg:col-span-3">


    <!-- HERO -->

    <div class="bg-gradient-to-r from-orange-500 to-green-500 rounded-3xl p-8 text-white mb-6">

      <h2 class="text-4xl font-bold mb-3">
        Find Schemes Faster
      </h2>

      <p class="text-orange-100 text-lg">
        Search schemes by categories, benefits, eligibility and more.
      </p>

    </div>



    <!-- SCHEME GRID -->

    <div
      id="schemesContainer"
      class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6"
    >
    </div>



    <!-- EMPTY -->

    <div
      id="emptyState"
      class="hidden bg-white rounded-3xl shadow p-10 text-center"
    >

      <i class="fa-solid fa-folder-open text-6xl text-gray-300 mb-5"></i>

      <h3 class="text-2xl font-bold mb-2">
        No Schemes Found
      </h3>

      <p class="text-gray-500">
        Try another category or search keyword.
      </p>

    </div>

  </section>

</div>




<script>


/* =========================================
CATEGORY ICONS
========================================= */

const categoryIcons = {

  "Health": "fa-heart-pulse",
  "Education": "fa-graduation-cap",
  "Infrastructure": "fa-road",
  "Digital": "fa-laptop-code",
  "Rural": "fa-tractor",
  "Food": "fa-wheat-awn",
  "Pension": "fa-user-shield",
  "Women": "fa-person-dress",
  "Employment": "fa-briefcase",
  "Agriculture": "fa-seedling",
  "Business": "fa-building",
  "Housing": "fa-house",
  "Youth": "fa-people-group",
  "Finance": "fa-indian-rupee-sign",
  "Transport": "fa-bus",
  "Energy": "fa-bolt"

};



/* =========================================
GLOBAL VARIABLES
========================================= */

let allSchemes = [];

let activeCategory = "All";



/* =========================================
FETCH explore.json
========================================= */

async function loadSchemes() {

  try {

    const response = await fetch("explore.json");

    const data = await response.json();

    allSchemes = data;

    generateCategories();

    renderSchemes();

  }

  catch(error) {

    console.error("Failed to load schemes:", error);

  }

}



/* =========================================
GENERATE CATEGORIES
========================================= */

function generateCategories() {

  const categoryContainer =
    document.getElementById("categoryContainer");

  categoryContainer.innerHTML = "";


  const categories = [

    "All",

    ...new Set(
      allSchemes.map(
        scheme => scheme.category
      )
    )

  ];


  categories.forEach(category => {

    const total =
      category === "All"
      ? allSchemes.length
      : allSchemes.filter(
          scheme => scheme.category === category
        ).length;


    const icon =
      categoryIcons[category] || "fa-layer-group";


    const button = document.createElement("button");


    button.className = `

      w-full text-left p-4 rounded-2xl transition

      ${
        activeCategory === category
        ? "bg-orange-500 text-white shadow-lg"
        : "bg-gray-100 hover:bg-orange-100"
      }

    `;


    button.innerHTML = `

      <div class="flex items-center justify-between">

        <div class="flex items-center gap-3">

          <div class="
            w-11 h-11 rounded-xl
            ${
              activeCategory === category
              ? "bg-white/20"
              : "bg-white"
            }
            flex items-center justify-center
          ">

            <i class="
              fa-solid ${icon}
              ${
                activeCategory === category
                ? "text-white"
                : "text-orange-500"
              }
            "></i>

          </div>


          <div>

            <p class="font-semibold">
              ${category}
            </p>

            <p class="
              text-xs
              ${
                activeCategory === category
                ? "text-orange-100"
                : "text-gray-500"
              }
            ">
              ${total} schemes
            </p>

          </div>

        </div>

      </div>

    `;


    button.onclick = () => {

      activeCategory = category;

      generateCategories();

      renderSchemes();

    };


    categoryContainer.appendChild(button);

  });

}




/* =========================================
RENDER SCHEMES
========================================= */

function renderSchemes() {

  const schemesContainer =
    document.getElementById("schemesContainer");

  const emptyState =
    document.getElementById("emptyState");

  const searchText =
    document.getElementById("searchInput")
    .value
    .toLowerCase();



  const filteredSchemes = allSchemes.filter(scheme => {

    const matchesCategory =

      activeCategory === "All" ||

      scheme.category === activeCategory;



    const matchesSearch =

      scheme.title.toLowerCase().includes(searchText) ||

      scheme.description.toLowerCase().includes(searchText) ||

      scheme.category.toLowerCase().includes(searchText) ||

      scheme.benefit.toLowerCase().includes(searchText) ||

      scheme.eligibility.toLowerCase().includes(searchText);



    return matchesCategory && matchesSearch;

  });




  /* UPDATE COUNT */

  document.getElementById("schemeCount")
    .innerText = filteredSchemes.length;




  /* CLEAR GRID */

  schemesContainer.innerHTML = "";




  /* EMPTY STATE */

  if(filteredSchemes.length === 0) {

    emptyState.classList.remove("hidden");

    return;

  }

  emptyState.classList.add("hidden");




  /* CREATE CARDS */

  filteredSchemes.forEach(scheme => {

    const card = document.createElement("div");

    card.className = `
      scheme-card
      bg-white rounded-3xl shadow hover:shadow-2xl
      overflow-hidden
    `;




    card.innerHTML = `

      <div class="p-6">


        <!-- TOP -->

        <div class="flex justify-between items-start mb-5">

          <div class="
            w-16 h-16 rounded-2xl
            bg-orange-100
            flex items-center justify-center
          ">

            <i class="
              fa-solid
              ${scheme.icon || "fa-landmark"}
              text-orange-600 text-2xl
            "></i>

          </div>


          <span class="
            bg-slate-100 text-slate-700
            px-3 py-1 rounded-full text-xs font-semibold
          ">
            ${scheme.category}
          </span>

        </div>




        <!-- TITLE -->

        <h3 class="text-xl font-bold mb-3 line-clamp-2">
          ${scheme.title}
        </h3>




        <!-- DESC -->

        <p class="text-gray-500 text-sm leading-relaxed mb-5">
          ${scheme.description}
        </p>




        <!-- BENEFIT -->

        <div class="bg-green-50 rounded-2xl p-4 mb-4">

          <p class="text-xs text-gray-500 mb-1">
            Benefit
          </p>

          <p class="font-semibold text-green-700">
            ${scheme.benefit}
          </p>

        </div>




        <!-- ELIGIBILITY -->

        <div class="bg-orange-50 rounded-2xl p-4 mb-5">

          <p class="text-xs text-gray-500 mb-1">
            Eligibility
          </p>

          <p class="font-semibold text-orange-700">
            ${scheme.eligibility}
          </p>

        </div>




        <!-- BUTTONS -->

        <div class="flex gap-3">

          <button class="
            flex-1 bg-orange-500 hover:bg-orange-600
            text-white py-3 rounded-2xl
            font-semibold transition
          ">
            View Details
          </button>


          <button class="
            w-14 bg-gray-100 hover:bg-gray-200
            rounded-2xl transition
          ">
            <i class="fa-regular fa-bookmark"></i>
          </button>

        </div>

      </div>

    `;



    schemesContainer.appendChild(card);

  });

}




/* =========================================
SEARCH EVENT
========================================= */

document
.getElementById("searchInput")
.addEventListener("input", renderSchemes);




/* =========================================
INITIAL LOAD
========================================= */

loadSchemes();


</script>

</body>
</html>

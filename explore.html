
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Explore Schemes</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f5f5;
  padding:20px;
  color:#222;
}

/* HEADER */

.header{
  margin-bottom:25px;
}

.header h1{
  font-size:32px;
  margin-bottom:6px;
}

.header p{
  color:#666;
}

/* SEARCH */

.search-box{
  margin-bottom:20px;
}

.search-box input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
  outline:none;
  background:white;
}

.search-box input:focus{
  border-color:#ff7a00;
}

/* CATEGORIES */

.categories{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:25px;
}

.category-btn{
  border:none;
  background:white;
  border:1px solid #ddd;
  padding:10px 18px;
  border-radius:30px;
  cursor:pointer;
  transition:0.3s;
}

.category-btn:hover{
  background:#f0f0f0;
}

.category-btn.active{
  background:#ff7a00;
  color:white;
  border-color:#ff7a00;
}

/* GRID */

.scheme-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
}

/* CARD */

.scheme-card{
  background:white;
  border-radius:16px;
  padding:20px;
  border:1px solid #e5e5e5;
  animation:fadeIn 0.4s ease;
  transition:0.3s;
}

.scheme-card:hover{
  transform:translateY(-4px);
}

.scheme-card h3{
  margin-bottom:12px;
  font-size:20px;
}

.scheme-card p{
  color:#666;
  line-height:1.5;
  margin-bottom:14px;
}

.tag{
  display:inline-block;
  background:#f3f3f3;
  padding:6px 12px;
  border-radius:20px;
  font-size:13px;
  margin-bottom:14px;
}

.apply-btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#ff7a00;
  color:white;
  cursor:pointer;
  font-size:15px;
}

.apply-btn:hover{
  background:#e46d00;
}

/* EMPTY */

.empty{
  display:none;
  text-align:center;
  margin-top:40px;
  color:#777;
}

/* ANIMATION */

@keyframes fadeIn{

  from{
    opacity:0;
    transform:translateY(10px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

  <h1>Explore Schemes</h1>

  <p>Search and explore government schemes</p>

</div>

<!-- SEARCH -->

<div class="search-box">

  <input
    type="text"
    id="searchInput"
    placeholder="Search schemes..."
  >

</div>

<!-- CATEGORIES -->

<div class="categories" id="categoryButtons"></div>

<!-- SCHEMES -->

<div class="scheme-grid" id="schemeGrid"></div>

<!-- EMPTY -->

<div class="empty" id="emptyState">
  No schemes found
</div>

<script>

let allSchemes = [];
let activeCategory = "All";

/* ================= LOAD JSON ================= */

async function loadSchemes() {

  try {

    const response = await fetch("explore.json");

    if (!response.ok) {
      throw new Error(`HTTP error! ${response.status}`);
    }

    const data = await response.json();

    console.log("Loaded JSON:", data);

    allSchemes = data.schemes || data;

    renderCategories();
    renderSchemes();

  }

  catch(error) {

    console.error("JSON LOAD ERROR:", error);

    document.getElementById("schemeGrid").innerHTML = `
      <div style="
        background:white;
        padding:20px;
        border-radius:12px;
        border:1px solid #ddd;
      ">
        <h3>Unable to load explore.json</h3>

        <p style="margin-top:10px;">
          Make sure:
        </p>

        <ul style="margin-top:10px;padding-left:18px;">
          <li>explore.json exists</li>
          <li>JSON is valid</li>
          <li>Both files are in same folder</li>
          <li>Use Live Server</li>
        </ul>
      </div>
    `;
  }

}

/* ================= CATEGORIES ================= */

function renderCategories() {

  const container = document.getElementById("categoryButtons");

  const categories = [
    "All",
    ...new Set(allSchemes.map(s => s.category))
  ];

  container.innerHTML = "";

  categories.forEach(category => {

    const btn = document.createElement("button");

    btn.className = `
      category-btn
      ${activeCategory === category ? "active" : ""}
    `;

    btn.textContent = category;

    btn.onclick = () => {

      activeCategory = category;

      renderCategories();
      renderSchemes();

    };

    container.appendChild(btn);

  });

}

/* ================= RENDER SCHEMES ================= */

function renderSchemes() {

  const grid = document.getElementById("schemeGrid");

  const search = document
    .getElementById("searchInput")
    .value
    .toLowerCase();

  let filtered = allSchemes.filter(scheme => {

    const matchesCategory =
      activeCategory === "All" ||
      scheme.category === activeCategory;

    const matchesSearch =
      scheme.name.toLowerCase().includes(search) ||
      scheme.description.toLowerCase().includes(search);

    return matchesCategory && matchesSearch;

  });

  grid.innerHTML = "";

  if(filtered.length === 0){

    document.getElementById("emptyState").style.display = "block";

    return;
  }

  document.getElementById("emptyState").style.display = "none";

  filtered.forEach(scheme => {

    const card = document.createElement("div");

    card.className = "scheme-card";

    card.innerHTML = `
      <h3>${scheme.name}</h3>

      <div class="tag">
        ${scheme.category}
      </div>

      <p>
        ${scheme.description}
      </p>

      <button class="apply-btn">
        View Scheme
      </button>
    `;

    grid.appendChild(card);

  });

}

/* ================= SEARCH ================= */

document
  .getElementById("searchInput")
  .addEventListener("input", renderSchemes);

/* ================= START ================= */

loadSchemes();

</script>

</body>
</html>

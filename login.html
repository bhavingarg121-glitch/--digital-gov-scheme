<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Digital Gov Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#e6eef8;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:20px;
}

/* MAIN CONTAINER */

.container{
    width:100%;
    max-width:950px;
    background:white;
    border-radius:20px;
    overflow:hidden;
    display:flex;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

/* LEFT */

.left{
    width:50%;
    background:#f4f8fd;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.left img{
    width:100%;
    max-width:350px;
}

/* RIGHT */

.right{
    width:50%;
    padding:40px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.login-box{
    width:100%;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:20px;
}

.logo-circle{
    width:40px;
    height:40px;
    background:#2f6fed;
    border-radius:50%;
}

.logo h1{
    font-size:22px;
    color:#2c3e50;
}

.login-box h2{
    margin-bottom:10px;
    color:#2c3e50;
}

.subtitle{
    color:#666;
    margin-bottom:25px;
    font-size:14px;
}

/* INPUTS */

label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
    color:#333;
}

.input-box{
    margin-bottom:18px;
    position:relative;
}

.input-box input{
    width:100%;
    padding:14px;
    border:1px solid #dcdcdc;
    border-radius:10px;
    outline:none;
    font-size:15px;
    transition:0.3s;
}

.input-box input:focus{
    border-color:#2f6fed;
}

.toggle-password{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    font-size:13px;
    color:#2f6fed;
}

/* OPTIONS */

.extra{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    font-size:13px;
}

.extra a{
    color:#2f6fed;
    text-decoration:none;
}

/* BUTTON */

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#2f6fed;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#1e56d0;
}

/* MESSAGE */

.message{
    margin-top:15px;
    font-size:14px;
    text-align:center;
    display:none;
}

.success{
    color:green;
}

.error{
    color:red;
}

/* SIGNUP */

.signup{
    margin-top:20px;
    text-align:center;
    font-size:14px;
}

.signup a{
    color:#2f6fed;
    text-decoration:none;
    font-weight:bold;
}

/* FOOTER */

footer{
    margin-top:20px;
    text-align:center;
    color:#666;
    font-size:12px;
    max-width:700px;
    line-height:1.5;
}

/* RESPONSIVE */

@media(max-width:800px){

    .container{
        flex-direction:column;
    }

    .left,
    .right{
        width:100%;
    }

    .left{
        padding:20px;
    }

}

</style>
</head>

<body>

<div class="container">

    <!-- LEFT -->

    <div class="left">

<img src="gov.png" alt="illustration">

    </div>

    <!-- RIGHT -->

    <div class="right">

        <div class="login-box">

            <div class="logo">

                <div class="logo-circle"></div>

                <h1>Digital Gov</h1>

            </div>

            <h2>Login to Your Account</h2>

            <p class="subtitle">
                Access government schemes easily
            </p>

            <form id="loginForm">

                <!-- USERNAME -->

                <label>Username</label>

                <div class="input-box">

                    <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    required>

                </div>

                <!-- PASSWORD -->

                <label>Password</label>

                <div class="input-box">

                    <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required>

                    <span
                    class="toggle-password"
                    onclick="togglePassword()">
                    Show
                    </span>

                </div>

                <!-- EXTRA -->

                <div class="extra">

                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>

                <!-- BUTTON -->

                <button type="submit">
                    Login
                </button>

                <!-- MESSAGE -->

                <div
                class="message"
                id="message">
                </div>

                <!-- SIGNUP -->

                <div class="signup">

                    Don't have an account?

                    <a href="register.html">
                        Sign Up
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

<footer>

    Disclaimer:
    This is an independent helping platform
    created for informational purposes only
    and is not affiliated with the Government of India.

</footer>

<script>

/* PASSWORD TOGGLE */

function togglePassword(){

    const password =
        document.getElementById("password");

    password.type =
        password.type === "password"
        ? "text"
        : "password";

}

/* LOGIN */

document
.getElementById("loginForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    /* DEMO LOGIN */

    if(
        username === "admin"
        &&
        password === "1234"
    ){

        localStorage.setItem(
            "loggedIn",
            "true"
        );

        localStorage.setItem(
            "username",
            username
        );

        message.style.display = "block";

        message.className =
            "message success";

        message.innerHTML =
            "Login successful! Redirecting...";

        setTimeout(() => {

            window.location.href =
                "explore.html";

        }, 1500);

    }

    else{

        message.style.display = "block";

        message.className =
            "message error";

        message.innerHTML =
            "Invalid username or password";

    }

});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Apply for PM-KISAN | SchemeBuddy Smart Apply</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
.step-active { background: linear-gradient(135deg, #f97316, #16a34a); color: white; }
.field-highlight { animation: pulse 2s infinite; box-shadow: 0 0 0 4px rgba(249,115,22,0.3); }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 4px rgba(249,115,22,0.3); } 50% { box-shadow: 0 0 0 8px rgba(249,115,22,0.1); } }
</style>
</head>
<body class="bg-gray-50">

<!-- Header -->
<nav class="bg-white shadow-sm py-4 px-6 sticky top-0 z-40">
  <div class="max-w-7xl mx-auto flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-gradient-to-br from-orange-500 to-green-600 rounded-lg flex items-center justify-center text-white font-bold">S</div>
      <div>
        <div class="font-bold">Smart Apply: PM-KISAN</div>
        <div class="text-xs text-gray-500">Saves ~30 minutes ⚡</div>
      </div>
    </div>
    <div class="flex gap-2">
      <button onclick="saveProgress()" class="px-4 py-2 border rounded-lg text-sm">💾 Save Progress</button>
      <div class="text-sm bg-green-100 text-green-700 px-3 py-2 rounded-lg">⏱ Time saved: <span id="timeSaved">0</span>s</div>
    </div>
  </div>
</nav>

<!-- Progress Bar -->
<div class="bg-white border-b">
  <div class="max-w-7xl mx-auto px-6 py-3">
    <div class="flex items-center justify-between text-sm" id="stepNav"></div>
    <div class="bg-gray-200 rounded-full h-2 mt-2">
      <div id="progressBar" class="h-full bg-gradient-to-r from-orange-500 to-green-600 rounded-full transition-all" style="width:0%"></div>
    </div>
  </div>
</div>

<!-- MAIN SPLIT VIEW -->
<div class="max-w-7xl mx-auto p-6">
  <div class="grid lg:grid-cols-2 gap-6">
    
    <!-- LEFT: INSTRUCTIONS -->
    <div class="bg-white rounded-2xl shadow-lg p-6 sticky top-32 h-fit">
      <div id="instructionPanel"></div>
    </div>

    <!-- RIGHT: FORM -->
    <div class="bg-white rounded-2xl shadow-lg p-6">
      <div id="formPanel"></div>
    </div>

  </div>
</div>

<!-- Floating Help Bot -->
<button onclick="openHelpBot()" class="fixed bottom-6 right-6 w-14 h-14 bg-gradient-to-r from-orange-500 to-green-600 text-white rounded-full shadow-2xl flex items-center justify-center text-2xl hover:scale-110 transition">
  🤖
</button>

<script src="js/smart-apply.js"></script>
</body>
</html>

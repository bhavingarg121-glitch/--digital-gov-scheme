
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SchemeSathi Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#07142b;
color:white;
overflow-x:hidden;
}

.background{
position:fixed;
inset:0;
z-index:-2;
}

.background img{
width:100%;
height:100%;
object-fit:cover;
filter:brightness(.3);
}

.overlay{
position:absolute;
inset:0;
background:linear-gradient(
135deg,
rgba(7,20,43,.95),
rgba(15,23,42,.9),
rgba(249,115,22,.15)
);
}

.glass{
background:rgba(255,255,255,.08);
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,.1);
}

.scheme-card{
background:rgba(255,255,255,.08);
border-radius:24px;
padding:24px;
transition:.3s;
}

.scheme-card:hover{
transform:translateY(-6px);
}

.gradient-text{
background:linear-gradient(to right,#60a5fa,#f97316);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

button{
transition:.3s;
}

</style>
</head>
<body>

<div class="background">
<img src="Background.png" alt="bg">
<div class="overlay"></div>
</div>

<div class="max-w-[1500px] mx-auto">

<header class="glass sticky top-0 z-50">
<div class="flex justify-between items-center px-8 py-5">

<h1 class="text-4xl font-extrabold">
SchemeSathi
</h1>

<div class="flex items-center gap-4">

<button onclick="showNotifications()" class="bg-white/10 px-5 py-3 rounded-xl">
🔔
</button>

<div class="glass px-5 py-3 rounded-xl">
👤 Bhavin
</div>

</div>
</div>
</header>

<section class="px-8 py-14">

<div class="glass rounded-3xl p-10">

<div class="flex flex-col lg:flex-row justify-between gap-10 items-center">

<div>

<h1 class="text-6xl font-extrabold leading-tight">
Smart
<span class="gradient-text">
Government Dashboard
</span>
</h1>

<p class="text-xl text-gray-200 mt-8 max-w-3xl">
Track eligibility, applications and government schemes.
</p>

</div>

<div class="glass rounded-3xl p-8 text-center min-w-[250px]">

<h2 id="eligibleCount" class="text-7xl font-extrabold text-blue-300">
0
</h2>

<p class="text-2xl mt-4">
Eligible Schemes
</p>

</div>

</div>

</div>

</section>

<section class="px-8 py-10">

<h2 class="text-4xl font-bold mb-8">
Profile
</h2>

<div class="glass rounded-3xl p-8 grid md:grid-cols-2 gap-8">

<div class="space-y-5">

<input id="userName" type="text" placeholder="Your Name" class="w-full bg-white text-black px-5 py-4 rounded-xl">

<input id="userIncome" type="number" placeholder="Family Income" class="w-full bg-white text-black px-5 py-4 rounded-xl">

<input id="userAge" type="number" placeholder="Age" class="w-full bg-white text-black px-5 py-4 rounded-xl">

<select id="userOccupation" class="w-full bg-white text-black px-5 py-4 rounded-xl">
<option>Student</option>
<option>Farmer</option>
<option>Employee</option>
<option>Business</option>
</select>

<select id="stateFilter" class="w-full bg-white text-black px-5 py-4 rounded-xl">
<option value="all">All States</option>
<option value="Delhi">Delhi</option>
<option value="Assam">Assam</option>
<option value="Maharashtra">Maharashtra</option>
<option value="Karnataka">Karnataka</option>
</select>

<button onclick="saveProfile()" class="bg-blue-600 hover:bg-blue-700 px-8 py-4 rounded-xl w-full">
Save Profile
</button>

</div>

<div class="glass rounded-3xl p-8">

<h3 class="text-3xl font-bold mb-6">
Application Tracker
</h3>

<div id="applicationTracker" class="space-y-5"></div>

</div>

</div>

</section>

<section class="px-8 py-16">

<div class="flex justify-between items-center mb-10">

<h2 class="text-5xl font-bold">
Recommended Schemes
</h2>

<button onclick="loadRecommendations()" class="bg-orange-500 px-6 py-3 rounded-xl">
Refresh
</button>

</div>

<div id="recommendations" class="grid md:grid-cols-3 gap-8"></div>

</section>

<section class="px-8 py-16">

<h2 class="text-5xl font-bold mb-10">
Saved Schemes
</h2>

<div id="savedSchemes" class="grid md:grid-cols-3 gap-8"></div>

</section>

<div id="notificationPanel" class="hidden fixed top-24 right-8 glass rounded-3xl p-6 w-[350px] z-50">

<h3 class="text-2xl font-bold mb-5">
Notifications
</h3>

<div class="space-y-4">

<div class="glass p-4 rounded-xl">
PM Kisan approved
</div>

<div class="glass p-4 rounded-xl">
Scholarship pending
</div>

<div class="glass p-4 rounded-xl">
New startup scheme available
</div>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
setDoc,
doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getAuth,
signInAnonymously
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyDVbSTJ5-JALcukU2FiavqeMqkvrKkfGS0",
authDomain: "schemesathi-bfc0b.firebaseapp.com",
projectId: "schemesathi-bfc0b",
storageBucket: "schemesathi-bfc0b.firebasestorage.app",
messagingSenderId: "384640220695",
appId: "1:384640220695:web:f4ee2d706c098beef02652"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let schemes = [];

let savedSchemes = JSON.parse(localStorage.getItem("savedSchemes")) || [];

let profile = JSON.parse(localStorage.getItem("profile")) || {};

signInAnonymously(auth)
.then(()=>{
console.log("Firebase Connected");
})
.catch((err)=>{
console.log(err);
});

window.showNotifications = function(){
document.getElementById("notificationPanel").classList.toggle("hidden");
};

function loadProfile(){

if(!profile) return;

document.getElementById("userName").value = profile.name || "";
document.getElementById("userIncome").value = profile.income || "";
document.getElementById("userAge").value = profile.age || "";
document.getElementById("userOccupation").value = profile.occupation || "Student";
document.getElementById("stateFilter").value = profile.state || "all";

}

window.saveProfile = async function(){

profile = {
name:document.getElementById("userName").value,
income:document.getElementById("userIncome").value,
age:document.getElementById("userAge").value,
occupation:document.getElementById("userOccupation").value,
state:document.getElementById("stateFilter").value
};

localStorage.setItem("profile",JSON.stringify(profile));

await setDoc(doc(db,"profiles","mainUser"),profile);

alert("Profile Saved");

loadRecommendations();

};

fetch("explore.json")
.then(res=>res.json())
.then(data=>{

schemes = data.schemes || data;

loadRecommendations();
renderSaved();
renderTracker();

})
.catch(err=>{
console.log(err);
});

window.loadRecommendations = function(){

const container = document.getElementById("recommendations");
container.innerHTML = "";

let filtered = schemes.filter(scheme=>{

let matchOccupation = true;
let matchState = true;

if(profile.occupation){
matchOccupation = (scheme.category || "")
.toLowerCase()
.includes(profile.occupation.toLowerCase());
}

if(profile.state && profile.state !== "all"){
matchState = scheme.state === profile.state;
}

return matchOccupation || matchState;

});

if(filtered.length === 0){
filtered = schemes.slice(0,6);
}

document.getElementById("eligibleCount").innerText = filtered.length;

filtered.slice(0,6).forEach(scheme=>{

const card = document.createElement("div");

card.className = "scheme-card";

card.innerHTML = `

<h3 class="text-3xl font-bold">
${scheme.name || scheme.title || "Scheme"}
</h3>

<p class="mt-5 text-gray-200">
${scheme.description || "No Description"}
</p>

<div class="flex gap-3 mt-5 flex-wrap">

<span class="bg-blue-500/20 px-4 py-2 rounded-full">
${scheme.category || "General"}
</span>

<span class="bg-orange-500/20 px-4 py-2 rounded-full">
${scheme.state || "India"}
</span>

</div>

<div class="flex gap-4 mt-6">

<button class="bg-blue-600 px-5 py-3 rounded-xl save-btn">
Save
</button>

<a href="${scheme.link || '#'}" target="_blank" class="bg-orange-500 px-5 py-3 rounded-xl text-center">
Apply
</a>

</div>

`;

card.querySelector(".save-btn")
.addEventListener("click",()=>{
saveScheme(scheme);
});

container.appendChild(card);

});

};

window.saveScheme = async function(scheme){

savedSchemes.push(scheme);

localStorage.setItem(
"savedSchemes",
JSON.stringify(savedSchemes)
);

await addDoc(collection(db,"savedSchemes"),scheme);

renderSaved();

alert("Scheme Saved");

};

function renderSaved(){

const container = document.getElementById("savedSchemes");

container.innerHTML = "";

savedSchemes.forEach(scheme=>{

const card = document.createElement("div");

card.className = "scheme-card";

card.innerHTML = `

<h3 class="text-2xl font-bold">
${scheme.name || scheme.title}
</h3>

<p class="mt-4 text-gray-200">
${scheme.description || "No Description"}
</p>

`;

container.appendChild(card);

});

}

function renderTracker(){

const tracker = document.getElementById("applicationTracker");

tracker.innerHTML = `

<div class="glass p-5 rounded-2xl">

<div class="flex justify-between mb-3">
<h4 class="text-2xl font-bold">PM Kisan</h4>
<span class="text-green-300">Approved</span>
</div>

<div class="w-full bg-white/10 rounded-full h-4">
<div class="bg-green-500 h-4 rounded-full w-full"></div>
</div>

</div>

<div class="glass p-5 rounded-2xl mt-5">

<div class="flex justify-between mb-3">
<h4 class="text-2xl font-bold">Scholarship</h4>
<span class="text-yellow-300">Pending</span>
</div>

<div class="w-full bg-white/10 rounded-full h-4">
<div class="bg-yellow-400 h-4 rounded-full w-[70%]"></div>
</div>

</div>

`;

}

loadProfile();
renderSaved();

</script>

</div>
</body>
</html>
